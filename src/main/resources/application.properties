# ===============================
# APPLICATION
# ===============================
spring.application.name=trading
server.port=${PORT:8080}

# ===============================
# DATABASE (Neon PostgreSQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# HIKARI (Connection Pool)
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.validation-timeout=5000

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true

# ⚠️ Do NOT add dialect (auto-detected)

# ===============================
# SSL (Neon Required)
# ===============================
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# ===============================
# EMAIL CONFIG
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# PAYMENT KEYS (TEMP HARDCODE)
# ===============================
stripe.api.key=sk_test_dummy_key   # ✅ temporary hardcoded
razorpay.api.key=${RAZORPAY_KEY:}
razorpay.api.secret=${RAZORPAY_SECRET:}

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.com.shirish=DEBUG

spring.jmx.enabled=false
