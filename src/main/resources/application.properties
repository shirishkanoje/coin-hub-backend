# ===============================
# APPLICATION
# ===============================
spring.application.name=trading
server.port=${PORT:8080}

# ===============================
# DATABASE (Handled by Render ENV)
# ===============================
# DO NOT define spring.datasource.* here
# Render automatically injects:
# SPRING_DATASOURCE_URL
# SPRING_DATASOURCE_USERNAME
# SPRING_DATASOURCE_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# EMAIL CONFIG
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# PAYMENT KEYS
# ===============================
stripe.api.key=${STRIPE_KEY}
razorpay.api.key=${RAZORPAY_KEY}
razorpay.api.secret=${RAZORPAY_SECRET}
